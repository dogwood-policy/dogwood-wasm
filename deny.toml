# cargo-deny policy, enforced by .github/workflows/ci.yml (`cargo deny --locked check`).
# Every crate here is statically linked into the published wasm module, so the
# whole graph is held to the same bar.

[advisories]
# Any RustSec vulnerability, unmaintained or unsound notice, or yanked version
# fails CI. To accept one, add its ID to `ignore` with a reason and an owner.
unmaintained = "all"
yanked = "deny"
ignore = [
    # smartstring is unmaintained (no vulnerability). It reaches us only via
    # rhai -> dogwood-language, and no fixed version exists. Drop this once
    # rhai moves off it. Owner: Dogwood maintainers.
    { id = "RUSTSEC-2026-0249", reason = "transitive via rhai; no maintained alternative upstream yet" },
]

[licenses]
# Permissive licenses compatible with distributing under Apache-2.0.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
# Single-crate exceptions for licenses outside the allowlist. Each one needs
# open-source review sign-off before it is added.
exceptions = [
    # rhai's small-string type. MPL-2.0 is file-level copyleft: fine to link,
    # but changes to smartstring's own files would have to be published.
    { crate = "smartstring", allow = ["MPL-2.0"] },
    # Public-domain dedication; pulled in by const-random (via ahash).
    { crate = "tiny-keccak", allow = ["CC0-1.0"] },
]

[bans]
# Duplicate major versions are common in this graph (getrandom, thiserror,
# syn); report them without failing.
multiple-versions = "warn"
wildcards = "deny"
# The `path` dependencies of this crate itself are not wildcards.
allow-wildcard-paths = true

[sources]
# Only crates.io. A git or alternate-registry dependency fails CI.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

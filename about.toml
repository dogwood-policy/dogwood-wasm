#
# cargo-about configuration for THIRD-PARTY-NOTICES, the attribution file
# shipped in the npm package. scripts/third-party-notices.sh generates it.
#
# `accepted` must match deny.toml: its `allow` list plus the two single-crate
# exceptions (smartstring, MPL-2.0; tiny-keccak, CC0-1.0). cargo-deny remains
# the gate on which licenses may enter the tree; this only renders them.

accepted = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "MIT",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
]

# Only what is compiled into the wasm32 module. Build dependencies (proc
# macros and build scripts) stay in: their generated code is in the binary.
targets = ["wasm32-unknown-unknown"]
ignore-dev-dependencies = true
ignore-build-dependencies = false

# dogwood-wasm itself (publish = false) is first-party: its LICENSE and NOTICE
# ship in the package separately.
private = { ignore = true }

[package]
name = "dogwood-wasm"
version = "1.1.0"
edition = "2024"
license = "Apache-2.0"
# wasm-pack copies this into pkg/package.json; npm provenance requires it to
# match the GitHub repository the release workflow runs in.
repository = "https://github.com/dogwood-policy/dogwood-wasm"
publish = false
description = "TypeScript/WebAssembly bindings for the Dogwood policy frontend (validate, lower, replay, schema checks)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# The Dogwood operations, shared with the `dogwood` CLI and the other language
# bindings: every report, error, the live authorizer and the input limits come
# from here, so this crate is only the wasm-bindgen shell over them.
dogwood-ops = { version = "1.2", features = ["mcp-schema"] }

wasm-bindgen = "0.2"
js-sys = "0.3"
serde = "1"
serde_json = "1"
# Idiomatic JS <-> serde conversion (returns real JS objects, not JSON strings).
# The TS shapes of the converted types are declared in `src/types.rs`.
serde-wasm-bindgen = "0.6"

# ── wasm randomness backends for transitive deps ───────────────────────
# Cedar/ahash/const-random pull in `getrandom`. On wasm32-unknown-unknown it
# has no default backend; these direct deps enable the JS-crypto backend for
# both major versions in the tree (unified across the whole graph). getrandom
# 0.3 also needs `--cfg getrandom_backend="wasm_js"`, set in .cargo/config.toml.
getrandom = { version = "0.3", features = ["wasm_js"] }
getrandom_legacy = { package = "getrandom", version = "0.2", features = ["js"] }
# Cedar/mcp-tools-sdk pull in `uuid`, which likewise needs a wasm randomness
# source; the `js` feature routes it through getrandom's JS backend.
uuid = { version = "1", features = ["js"] }

# Route Rust panics to console.error with a readable message. Development
# builds only (`npm run build:dev`): a panic message can carry policy or event
# data, and a release build must not write it to the host's console.
console_error_panic_hook = { version = "0.1", optional = true }

[features]
default = []
dev = ["console_error_panic_hook"]

# Rust/LLVM now emit bulk-memory and sign-extension ops by default; the
# wasm-opt bundled with wasm-pack must be told to accept them. These features
# are supported by every current wasm engine (Node 16+, modern browsers).
[package.metadata.wasm-pack.profile.release]
wasm-opt = ['-Os', '--enable-bulk-memory', '--enable-sign-ext', '--enable-nontrapping-float-to-int', '--enable-mutable-globals']
